# Paths stay empty on purpose: the plugin resolves them from
# DSH_LIT_WORKFLOW / DSH_LIT_CARDS / DSH_LIT_LEARNING, then from home-directory
# defaults. Set them only when your directories live somewhere else.
- insert:
    - id: dsh-lit-learning
      name: 'dsh-lit-learning'
      config:
        workflowRoot: ''
        cardsHome: ''
        learningRoot: ''
        rubricPath: ''
        lexiconDir: ''
        review:
          intervalDays: [1, 3, 7, 16, 35, 75]
          passScore: 3
          dailyLimit: 20
        autoBuild: true
        nativeUI: true
        writeCards: false
        writeOutsideLearningRoot: false
