name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        run: |
          set -e
          for f in $(find packages -name '*.mjs' -o -name 'client.js' | sort); do
            node --check "$f"
          done
      - name: literature-workflow tests
        working-directory: packages/literature-workflow
        run: node --test tests/*.test.mjs
      - name: knowledge-cards tests
        working-directory: packages/knowledge-cards
        run: node --test tests/*.test.mjs
      - name: lit-learning tests
        working-directory: packages/lit-learning
        run: |
          npm install --no-audit --no-fund
          node --test tests/*.test.mjs

  python:
    name: python compile + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: compile
        run: python -m compileall -q packages/literature-workflow
      - name: pytest (Windows-oriented; informational on Linux)
        continue-on-error: true
        run: python -m pytest packages/literature-workflow/tests -q
